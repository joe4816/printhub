name: Materialize PrintHub CRX

on:
  push:
    branches: [main]
    paths:
      - optional/chrome-extension/printhub-bridge.crx.b64
      - .github/workflows/materialize-printhub-crx.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode signed CRX
        run: |
          base64 -d optional/chrome-extension/printhub-bridge.crx.b64 > optional/chrome-extension/printhub-bridge.crx
      - name: Commit binary package when changed
        run: |
          if git diff --quiet -- optional/chrome-extension/printhub-bridge.crx && git ls-files --error-unmatch optional/chrome-extension/printhub-bridge.crx >/dev/null 2>&1; then
            echo "CRX already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optional/chrome-extension/printhub-bridge.crx
          git commit -m "Materialize signed PrintHub bridge CRX"
          git push
